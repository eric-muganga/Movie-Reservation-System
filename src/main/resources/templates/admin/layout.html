<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="head(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">Admin Dashboard</title>
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <style>
            :root {
                --sidebar-width: 280px;
                --page-bg: #f5f7fb;
            }
            body { background: var(--page-bg); }
            .sidebar {
                width: var(--sidebar-width);
                min-height: 100vh;
                position: fixed;
                inset: 0 auto 0 0;
                background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
                color: #fff;
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
                z-index: 1030;
            }
            .content-wrap {
                margin-left: var(--sidebar-width);
                min-height: 100vh;
            }
            .topbar {
                background: rgba(255,255,255,.9);
                backdrop-filter: blur(10px);
                border-bottom: 1px solid rgba(15,23,42,.08);
                position: sticky;
                top: 0;
                z-index: 1020;
            }
            .dashboard-shell { padding: 1.5rem; }
            .card-soft {
                border: 0;
                border-radius: 1.25rem;
                box-shadow: 0 0.75rem 2rem rgba(15,23,42,.06);
            }
        </style>
    </th:block>
</head>
<body>
<th:block th:fragment="layout(title, content)">
    <div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

    <div class="content-wrap">
        <div th:replace="~{admin/fragments/topbar :: topbar(title=${title})}"></div>

        <main class="dashboard-shell">
            <th:block th:replace="${content}"></th:block>
        </main>
    </div>

    <div th:replace="~{admin/fragments/scripts :: scripts}"></div>
</th:block>
</body>
</html>
