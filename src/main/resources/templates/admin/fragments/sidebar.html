<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="sidebar d-flex flex-column p-4">
    <div class="mb-4">
        <div class="brand d-flex align-items-center gap-3">
            <div class="rounded-4 bg-primary d-flex align-items-center justify-content-center"
                 style="width: 44px; height: 44px;">
                <span class="fw-bold">C</span>
            </div>
            <div>
                <h5 class="mb-0">Cinema Admin</h5>
                <small class="text-white-50">Reporting dashboard</small>
            </div>
        </div>
    </div>

    <nav class="nav nav-pills flex-column gap-2">
        <a class="nav-link"
           th:classappend="${#httpServletRequest.requestURI.contains('/admin/showtimes/daily')} ? 'active' : ''"
           th:href="@{/admin/showtimes/daily}">
            Daily showtimes
        </a>

        <a class="nav-link text-white-50" href="#">
            Movies
        </a>

        <a class="nav-link text-white-50" href="#">
            Revenue
        </a>

        <a class="nav-link text-white-50" href="#">
            Reservations
        </a>
    </nav>

    <div class="mt-auto pt-4">
        <div class="p-3 rounded-4" style="background: rgba(255,255,255,.06);">
            <div class="small text-white-50">Admin area</div>
            <div class="fw-semibold">Dashboard tools</div>
        </div>
    </div>
</div>
</body>
</html>
