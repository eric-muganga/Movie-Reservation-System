<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(${title}, ~{::section})}">
<head>
    <title th:text="${title}">Schedule Showtime</title>
</head>
<body>
<section class="page-section">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${title}">Schedule Showtime</h1>
            <p class="page-subtitle">
                Select a movie and auditorium, then set its screening time and ticket price.
            </p>
        </div>
    </div>

    <section class="card-soft form-card">
        <form th:action="${showtimeId == null}
                    ? @{/admin/showtimes}
                    : @{/admin/showtimes/{id}(id=${showtimeId})}"
              th:object="${showtimeForm}"
              method="post"
              class="form-vertical">

            <div class="form-group">
                <label for="movieId">Movie</label>

                <select id="movieId"
                        th:field="*{movieId}"
                        class="input-text">
                    <option value="">Select a movie</option>
                    <option th:each="movie : ${movies}"
                            th:value="${movie.id}"
                            th:text="${movie.title}">
                        Movie title
                    </option>
                </select>

                <div class="field-error"
                     th:if="${#fields.hasErrors('movieId')}"
                     th:errors="*{movieId}">
                    Movie error
                </div>
            </div>

            <div class="form-group">
                <label for="auditoriumId">Auditorium</label>

                <select id="auditoriumId"
                        th:field="*{auditoriumId}"
                        class="input-text">
                    <option value="">Select an auditorium</option>
                    <option th:each="auditorium : ${auditoriums}"
                            th:value="${auditorium.id}"
                            th:text="${auditorium.name + ' (' + auditorium.totalRows + ' rows × ' + auditorium.totalCols + ' seats)'}">
                        Auditorium name
                    </option>
                </select>

                <div class="field-error"
                     th:if="${#fields.hasErrors('auditoriumId')}"
                     th:errors="*{auditoriumId}">
                    Auditorium error
                </div>
            </div>

            <div class="form-group">
                <label for="startTime">Start time</label>

                <input id="startTime"
                       type="datetime-local"
                       th:field="*{startTime}"
                       class="input-text">

                <div class="field-error"
                     th:if="${#fields.hasErrors('startTime')}"
                     th:errors="*{startTime}">
                    Start time error
                </div>
            </div>

            <div class="form-group">
                <label for="endTime">End time</label>

                <input id="endTime"
                       type="datetime-local"
                       th:field="*{endTime}"
                       class="input-text">

                <div class="field-error"
                     th:if="${#fields.hasErrors('endTime')}"
                     th:errors="*{endTime}">
                    End time error
                </div>

                <div class="field-error"
                     th:if="${#fields.hasErrors('timeRangeValid')}"
                     th:errors="*{timeRangeValid}">
                    Time range error
                </div>
            </div>

            <div class="form-group">
                <label for="basePrice">Base price</label>

                <input id="basePrice"
                       type="number"
                       min="0.01"
                       step="0.01"
                       th:field="*{basePrice}"
                       class="input-text">

                <div class="field-error"
                     th:if="${#fields.hasErrors('basePrice')}"
                     th:errors="*{basePrice}">
                    Base price error
                </div>
            </div>

            <div class="form-actions">
                <button type="submit"
                        class="btn-primary"
                        th:text="${showtimeId == null} ? 'Schedule showtime' : 'Save changes'">
                    Save
                </button>

                <a th:href="@{/admin/showtimes}" class="btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </section>
</section>
</body>
</html>
